<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171128"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#50c7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <circle cx="1035" cy="85" r="150" fill="#7c5cff" opacity="0.06"/>
  <circle cx="110" cy="560" r="180" fill="#50c7ff" opacity="0.05"/>

  <text x="60" y="72" fill="#f7f8ff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">
    LLM Behaviour Architecture
  </text>
  <text x="60" y="108" fill="#aeb7d7" font-family="Arial, Helvetica, sans-serif" font-size="17">
    Context • hierarchy • behaviour • evaluation • regression
  </text>

  <path d="M160 255 C260 255 260 190 365 190" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M160 365 C260 365 260 430 365 430" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M495 190 C585 190 585 280 670 280" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M495 430 C585 430 585 340 670 340" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M805 310 C900 310 900 310 980 310" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.8"/>

  <g filter="url(#shadow)">
    <rect x="55" y="205" width="210" height="100" rx="18" fill="#151c33" stroke="#52608b"/>
    <text x="160" y="243" text-anchor="middle" fill="#f4f6ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">User intent</text>
    <text x="160" y="272" text-anchor="middle" fill="#9da9cf" font-family="Arial, Helvetica, sans-serif" font-size="14">Goal • constraints • task</text>

    <rect x="55" y="325" width="210" height="100" rx="18" fill="#151c33" stroke="#52608b"/>
    <text x="160" y="363" text-anchor="middle" fill="#f4f6ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Persistent context</text>
    <text x="160" y="392" text-anchor="middle" fill="#9da9cf" font-family="Arial, Helvetica, sans-serif" font-size="14">Memory • scope • relevance</text>

    <rect x="365" y="140" width="240" height="100" rx="18" fill="#17192f" stroke="#755ff4"/>
    <text x="485" y="178" text-anchor="middle" fill="#f4f6ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Task-local context</text>
    <text x="485" y="207" text-anchor="middle" fill="#b3aef4" font-family="Arial, Helvetica, sans-serif" font-size="14">Temporary state • evidence</text>

    <rect x="365" y="380" width="240" height="100" rx="18" fill="#17192f" stroke="#755ff4"/>
    <text x="485" y="418" text-anchor="middle" fill="#f4f6ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Behavioural rules</text>
    <text x="485" y="447" text-anchor="middle" fill="#b3aef4" font-family="Arial, Helvetica, sans-serif" font-size="14">Guardrails • priorities • agency</text>

    <rect x="670" y="250" width="250" height="120" rx="20" fill="#151f35" stroke="#50c7ff"/>
    <text x="795" y="294" text-anchor="middle" fill="#f4f6ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Conflict resolution</text>
    <text x="795" y="323" text-anchor="middle" fill="#9dddf8" font-family="Arial, Helvetica, sans-serif" font-size="14">What applies?</text>
    <text x="795" y="347" text-anchor="middle" fill="#9dddf8" font-family="Arial, Helvetica, sans-serif" font-size="14">What wins? What is uncertain?</text>

    <rect x="980" y="250" width="165" height="120" rx="20" fill="#182233" stroke="#8d98ba"/>
    <text x="1062" y="292" text-anchor="middle" fill="#f4f6ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Output</text>
    <text x="1062" y="322" text-anchor="middle" fill="#aeb7d7" font-family="Arial, Helvetica, sans-serif" font-size="14">Generate</text>
    <text x="1062" y="346" text-anchor="middle" fill="#aeb7d7" font-family="Arial, Helvetica, sans-serif" font-size="14">then evaluate</text>
  </g>

  <path d="M1062 370 C1062 520 790 550 610 530 C470 514 395 510 255 510" stroke="#f09dff" stroke-width="2.4" stroke-dasharray="8 8" fill="none" opacity="0.8"/>
  <polygon points="253,510 266,503 264,518" fill="#f09dff"/>
  <text x="675" y="566" text-anchor="middle" fill="#d9b9f4" font-family="Arial, Helvetica, sans-serif" font-size="15">
    Evaluation loop → classify failure → change smallest relevant layer → retest
  </text>
</svg>